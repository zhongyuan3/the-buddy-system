[package]
name = "the-buddy-system-derive"
version = "0.1.0"
edition = "2024"
description = "Derive macro for the the_buddy_system::PageFrame trait"
license = "MIT"
repository = "https://github.com/zhongyuan3/the-buddy-system"
readme = "README.md"
documentation = "https://docs.rs/the-buddy-system-derive"
keywords = ["derive", "no-std", "memory-allocator", "physical-memory"]
categories = ["no-std", "memory-management"]
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro-crate = "3"
